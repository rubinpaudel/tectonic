services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: tunnelvision
      POSTGRES_PASSWORD: tunnelvision
      POSTGRES_DB: tunnelvision
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tunnelvision -d tunnelvision"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres_data:
